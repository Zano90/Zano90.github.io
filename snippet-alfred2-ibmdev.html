<script type='text/javascript'>
    // load hidden pre-chat fields with user context
    window.addEventListener('onEmbeddedMessagingReady', () => {
        try {
            const ctx = {}; // TODO: load context information object & ensure below properties are populated correctly

            const isLoggedIn = !!ctx.isLoggedIn; // TODO: verify if ctx.isLoggedIn is correct

            const contextGeneral = {
                "IsLOggedIn": String(isLoggedIn),

</script>
