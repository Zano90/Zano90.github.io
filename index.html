<script type='text/javascript'>
function pushPrechatFields(tag) {
    const ctx = window.SITE_CONTEXT || {};
    const isLoggedIn = !!ctx.isLoggedIn;

    // Names MUST match the hiddenFormFields in the published deployment config.
    const contextGeneral = {
        "WebPageURL":     String(window.location.href).slice(0, 255),  // max 255
        "WebIsLoggedIn":  String(isLoggedIn),                          // max 10
        "WebClientIP":    String(ctx.clientIp || "").slice(0, 80),     // max 80
        "WebLanguage":    String(ctx.language || "").slice(0, 80)      // max 80
    };

    const contextLoggedIn = !isLoggedIn ? {} : {
        "WebUserId": String(ctx.userId || "").slice(0, 255),           // max 255
        "WebRoles":  String(ctx.roles  || "").slice(0, 255)            // max 255
    };

    const payload = { ...contextGeneral, ...contextLoggedIn };

    try {
        embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields(payload);
        console.log('[prechat] sent @ ' + tag, payload);
    } catch (e) {
        console.error('[prechat] failed @ ' + tag, e);
    }
}

[
    'onEmbeddedMessagingReady',
    'onEmbeddedMessagingButtonCreated',
    'onEmbeddedMessagingButtonClicked'
].forEach(ev => window.addEventListener(ev, () => pushPrechatFields(ev)));

function initEmbeddedMessaging() {
    try {
        embeddedservice_bootstrap.settings.language = 'en_US';

        embeddedservice_bootstrap.init(
            '00D9Z00000PX42h',
            'Mall_Demo_Agentforce_Messaging',
            'https://flender--ibmdev.sandbox.my.site.com/ESWMallDemoAgentforceM1785964764088',
            {
                scrt2URL: 'https://flender--ibmdev.sandbox.my.salesforce-scrt.com'
            }
        );
    } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
    }
};
</script>
<script type='text/javascript' src='https://flender--ibmdev.sandbox.my.site.com/ESWMallDemoAgentforceM1785964764088/assets/js/bootstrap.min.js' onload='initEmbeddedMessaging()'></script>
